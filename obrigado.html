<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mensagem enviada | CondoTech SC</title>
<meta name="robots" content="noindex">
<link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css">
<style>
  .thanks{min-height:100vh;display:grid;place-items:center;text-align:center;background:var(--mist)}
  .thanks-card{background:#fff;border:1px solid var(--line);padding:clamp(2rem,6vw,4rem);max-width:560px}
  .thanks-card img{width:120px;height:auto;margin:0 auto 1.75rem}
  .thanks-card .h2{font-size:clamp(1.5rem,4vw,2.1rem)}
  .thanks-actions{display:flex;flex-wrap:wrap;gap:.75rem;justify-content:center;margin-top:1.75rem}
</style>
</head>
<body>
<main class="thanks">
  <div class="thanks-card">
    <img src="assets/img/logo.png" alt="CondoTech SC">
    <p class="eyebrow" style="justify-content:center">Recebido</p>
    <h1 class="h2">Mensagem enviada</h1>
    <p>Obrigado pelo contato. Respondemos no e-mail ou telefone informado, em horário comercial.</p>
    <div class="thanks-actions">
      <a class="btn btn-solid" href="index.html">Voltar ao site</a>
      <a class="btn btn-wa" data-wa href="index.html#contato">Falar no WhatsApp</a>
    </div>
  </div>
</main>
<script src="assets/js/main.js" defer></script>
</body>
</html>
